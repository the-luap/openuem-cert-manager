name: Individual broker setup

on:
  pull_request:
  push:
    branches: [main, 'feature/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Protected setup, retry, identity loss and CLI
        run: go test -count=1 ./internal/broker ./internal/commands
      - name: Race checks
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./internal/broker ./internal/commands
      - run: go build ./...
